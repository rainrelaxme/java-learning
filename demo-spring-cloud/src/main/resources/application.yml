spring:
  application:
    name: demo

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/demo_dev?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: NOpa$$w0rd
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名自动映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL日志打印
  type-aliases-package: com.pocket.demo.entity

# 日志配置
logging:
  level:
    com.apple.msf.ass: DEBUG
    com.apple.msf.ass.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /